name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "office_watermark_remover.py"
      - "office_watermark_gui.py"
      - "office_watermark_gui_lite.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Full EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --optimize 2 `
            --name OfficeWatermarkRemover `
            office_watermark_gui.py

      - name: Build Lite EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --optimize 2 `
            --exclude-module pymupdf `
            --exclude-module fitz `
            --name OfficeWatermarkRemover-Lite `
            office_watermark_gui_lite.py

      - name: Show build sizes
        shell: pwsh
        run: |
          Get-Item dist\OfficeWatermarkRemover.exe, dist\OfficeWatermarkRemover-Lite.exe | `
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive `
            -Path dist\OfficeWatermarkRemover.exe,dist\OfficeWatermarkRemover-Lite.exe,dist\README.md `
            -DestinationPath OfficeWatermarkRemover-Windows.zip `
            -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeWatermarkRemover-Windows
          path: |
            dist/OfficeWatermarkRemover.exe
            dist/OfficeWatermarkRemover-Lite.exe
            OfficeWatermarkRemover-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update v1.0.1 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Office Watermark Remover v1.0.1

          Windows 构建体积优化版。

          ### 本版优化
          - 移除 `--collect-all tkinterdnd2`，改用 PyInstaller 平台专用 hook，避免打入无关平台的 TkDnD 二进制
          - 新增 Lite 轻量版，不打包 PyMuPDF，适合只处理 Word / Excel / PowerPoint / WPS / OpenDocument 的用户
          - 完整版继续保留 PDF 处理能力
          - 两个版本继续共用同一套 Office/WPS 去水印核心逻辑

          ### 下载建议
          - `OfficeWatermarkRemover-Lite.exe`：轻量版，不含 PDF，日常 Word/Excel/PPT/WPS 优先下载
          - `OfficeWatermarkRemover.exe`：完整版，包含 PDF 支持
          - `OfficeWatermarkRemover-Windows.zip`：两个 EXE + README

          > 建议仅处理有权修改的文件；正式材料处理后请人工复核版式和内容完整性。
          "@
          $notes | Set-Content -Path release-notes.md -Encoding UTF8

          gh release view v1.0.1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.1 `
              --target $env:GITHUB_SHA `
              --title "Office Watermark Remover v1.0.1" `
              --notes-file release-notes.md
          }

          gh release upload v1.0.1 `
            dist\OfficeWatermarkRemover.exe `
            dist\OfficeWatermarkRemover-Lite.exe `
            OfficeWatermarkRemover-Windows.zip `
            --clobber
