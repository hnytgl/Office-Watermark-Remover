name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "office_watermark_remover.py"
      - "office_watermark_gui.py"
      - "office_watermark_gui_lite.py"
      - "office_watermark_gui_v2.py"
      - "pdf_roundtrip.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Full EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --optimize 2 `
            --name OfficeWatermarkRemover `
            office_watermark_gui_v2.py

      - name: Build Lite EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --optimize 2 `
            --exclude-module pymupdf `
            --exclude-module fitz `
            --name OfficeWatermarkRemover-Lite `
            office_watermark_gui_lite.py

      - name: Show build sizes
        shell: pwsh
        run: |
          Get-Item dist\OfficeWatermarkRemover.exe, dist\OfficeWatermarkRemover-Lite.exe | `
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive `
            -Path dist\OfficeWatermarkRemover.exe,dist\OfficeWatermarkRemover-Lite.exe,dist\README.md `
            -DestinationPath OfficeWatermarkRemover-Windows.zip `
            -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeWatermarkRemover-Windows
          path: |
            dist/OfficeWatermarkRemover.exe
            dist/OfficeWatermarkRemover-Lite.exe
            OfficeWatermarkRemover-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update v1.1.0 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Office Watermark Remover v1.1.0

          PDF 去水印流程升级版。

          ### PDF 处理改进
          - 新增默认流程：PDF → Microsoft Word → Word 去水印 → PDF
          - 转换前自动识别重复/斜向的疑似水印文字，并作为 Word 层精确删除目标
          - PDF 转 Word 后可处理正文层中的水印文本、VML/DrawingML 水印对象
          - Word 往返失败时自动回退到原来的 PDF 直接处理模式
          - 不引入 pdf2docx 等额外大型依赖，控制完整版体积

          ### 使用说明
          - 推荐模式需要 Windows 已安装桌面版 Microsoft Word
          - 复杂排版、扫描件、图片型水印在两次转换后仍可能需要人工复核
          - Lite 版继续不含 PDF 功能，体积更小

          ### 下载
          - `OfficeWatermarkRemover.exe`：完整版，包含新的 PDF→Word→PDF 去水印流程
          - `OfficeWatermarkRemover-Lite.exe`：轻量版，不含 PDF
          - `OfficeWatermarkRemover-Windows.zip`：两个 EXE + README
          "@
          $notes | Set-Content -Path release-notes.md -Encoding UTF8

          gh release view v1.1.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.1.0 `
              --target $env:GITHUB_SHA `
              --title "Office Watermark Remover v1.1.0" `
              --notes-file release-notes.md
          }

          gh release upload v1.1.0 `
            dist\OfficeWatermarkRemover.exe `
            dist\OfficeWatermarkRemover-Lite.exe `
            OfficeWatermarkRemover-Windows.zip `
            --clobber
