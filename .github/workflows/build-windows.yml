name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "office_watermark_remover.py"
      - "office_watermark_gui.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name OfficeWatermarkRemover `
            --collect-all tkinterdnd2 `
            office_watermark_gui.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\OfficeWatermarkRemover.exe,dist\README.md -DestinationPath OfficeWatermarkRemover-Windows.zip -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeWatermarkRemover-Windows
          path: OfficeWatermarkRemover-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update v1.0.0 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Office Watermark Remover v1.0.0

          首个可直接使用的 Windows 图形版发布。

          ### 主要功能
          - 支持 Word / WPS OOXML 页眉 VML、DrawingML 等特殊水印
          - 支持 Excel、PowerPoint、PDF、OpenDocument
          - 支持部分 .wps/.et/.dps/.doc/.xls/.ppt 转换后处理
          - 图形界面支持文件/文件夹选择、批量处理和拖拽
          - 默认安全识别，可指定水印文字或启用激进模式
          - PDF 正文文字水印提供显式红删模式

          ### 下载
          - `OfficeWatermarkRemover.exe`：Windows 单文件程序
          - `OfficeWatermarkRemover-Windows.zip`：EXE + README 打包版

          > 建议仅处理有权修改的文件；正式材料处理后请人工复核版式和内容完整性。
          "@
          $notes | Set-Content -Path release-notes.md -Encoding UTF8

          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 `
              --target $env:GITHUB_SHA `
              --title "Office Watermark Remover v1.0.0" `
              --notes-file release-notes.md
          }

          gh release upload v1.0.0 `
            dist\OfficeWatermarkRemover.exe `
            OfficeWatermarkRemover-Windows.zip `
            --clobber
