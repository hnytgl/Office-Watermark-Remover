name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "office_watermark_remover.py"
      - "office_watermark_gui.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name OfficeWatermarkRemover `
            --collect-all tkinterdnd2 `
            office_watermark_gui.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\OfficeWatermarkRemover.exe,dist\README.md -DestinationPath OfficeWatermarkRemover-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OfficeWatermarkRemover-Windows
          path: OfficeWatermarkRemover-Windows.zip
          if-no-files-found: error
          retention-days: 30
